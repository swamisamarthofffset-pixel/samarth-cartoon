<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samarth Cartoon Images</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#141e30,#243b55);
    color:#fff;
}
header{
    text-align:center;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}
.gallery{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}
.card{
    background:#0d0d0d;
    border-radius:18px;
    padding:15px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,0.6);
}
.card img{
    width:100%;
    border-radius:14px;
}
button{
    margin-top:14px;
    padding:12px 22px;
    font-size:15px;
    color:#00ffd5;
    background:transparent;
    border:2px solid #00ffd5;
    border-radius:30px;
    cursor:pointer;
    transition:0.3s;
}
button:hover{
    background:#00ffd5;
    color:#000;
    transform:scale(1.08);
}
footer{
    text-align:center;
    padding:15px;
    font-size:14px;
    opacity:0.7;
}
</style>
</head>

<body>

<header>🎨 Samarth Cartoon Image Gallery</header>

<div class="gallery">

<div class="card">
    <img src="image1.jpg" alt="Cartoon Image">
    <button onclick="downloadWithWatermark('image1.jpg')">⬇ Download Image</button>
</div>

<div class="card">
    <img src="image2.jpg" alt="Cartoon Image">
    <button onclick="downloadWithWatermark('image2.jpg')">⬇ Download Image</button>
</div>

</div>

<footer>
© Samarth Cartoon Image | Free Download
</footer>

<script>
function downloadWithWatermark(imageSrc){
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = imageSrc;

    img.onload = function(){
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = img.width;
        canvas.height = img.height;

        // draw image
        ctx.drawImage(img, 0, 0);

        // watermark text
        const text = "Image By Samarth Cartoon Image (thanks)";
        ctx.font = `${Math.floor(canvas.width/30)}px Arial`;
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.textAlign = "center";

        // position bottom center
        ctx.fillText(text, canvas.width/2, canvas.height - 30);

        // download
        const link = document.createElement("a");
        link.download = "Samarth_Cartoon_Image.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    }
}
</script>

</body>
</html>
